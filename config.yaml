# share-it config

# What this instance is called and its color. When you run share-it on more
# than one domain, give each its own name and color: they install as separate
# apps, and these are what the app icon, the window bar and the page use, so
# you can tell them apart at a glance. Color is #rrggbb.
app_name: share-it
app_color: "#2563eb"

# Where uploaded files are stored inside the container.
# Mounted to ./data on the host via docker-compose.
data_dir: /data

# Files older than this are deleted on the next sweep.
max_age_days: 2

# How often the cleanup sweep runs.
cleanup_interval_sec: 3600

# Reject uploads larger than this (applies to anything not in text_extensions).
max_upload_mb: 1024

# Smaller cap for files listed in text_extensions.
max_upload_mb_text: 2

# secrets.token_urlsafe(N) -> ~1.3 * N chars. 16 -> 22-char tokens.
token_bytes: 16

# Live pad (the "Live" tab): size cap for the shared text buffer.
pad_max_kb: 128

# Per-file expiry. The page offers these choices (in hours) when uploading and
# under a file's "Keep for" menu. max_age_days above is the default choice,
# and nothing can be kept longer than max_expiry_days.
expiry_choices_hours: [1, 24, 48, 168, 720]
max_expiry_days: 30

# Show every file on the server to everyone who opens the page, not only the
# ones ticked as shared. Files already stored are listed at startup. Only turn
# this on for an instance that just you (or people you trust) can reach.
# The list still holds at most shared_max_items entries.
show_all_files: true

# How many entries the shared list holds before the oldest drop off it.
# Dropping off the list does not delete the file; the sweeper still owns that.
shared_max_items: 500

# File extensions rejected by /upload. Lowercase, no leading dot.
# Empty list disables the check. Default: executables, installers, and
# OS-level scripts that auto-run on click.
blocked_extensions:
  # Windows executables / installers / shortcuts
  - exe
  - msi
  - scr
  - com
  - bat
  - cmd
  - pif
  - hta
  - cpl
  - msc
  - lnk
  - reg
  # Windows scripts that double-click-execute
  - vbs
  - vbe
  - wsf
  - wsh
  - ps1
  - psm1
  # macOS bundles / installers
  - app
  - dmg
  - pkg
  - command
  # Linux packages / runnables
  - deb
  - rpm
  - appimage
  - run
  - snap
  - flatpak
  # Mobile app packages
  - apk
  - aab
  - ipa
  - xapk
  # Java runnables
  - jar
  - war
  - ear
  # Native shared libraries
  - dll
  - so
  - dylib

# Files treated as text — limited by max_upload_mb_text and previewed inline.
text_extensions:
  - txt
  - md

# Files treated as images — rendered as thumbnails in the history grid and
# inline in the lightbox. Anything outside this list (and text_extensions)
# shows a generic file badge instead.
image_extensions:
  - jpg
  - jpeg
  - png
  - gif
  - webp
  - svg
  - bmp
  - ico
  - avif
